<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Musongs: reproductor de música web construido sobre una lista doblemente enlazada." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23C93A26' d='M12 5v15.3A4.5 4.5 0 1 0 15 24.5V11l10-2.5v9.3A4.5 4.5 0 1 0 28 22V2z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" />
    <title>Musongs</title>
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <header id="top-bar" class="top-bar"></header>
      <aside id="sidebar" class="sidebar" aria-label="Menú principal"></aside>
      <div id="drawer-backdrop" class="drawer-backdrop"></div>
      <main id="main" class="main"></main>
      <main id="explore" class="main" aria-label="Explorar" hidden></main>
      <div id="structure-backdrop" class="structure-backdrop"></div>
      <aside id="structure-panel" class="structure-panel" aria-label="Panel lateral"></aside>
      <section id="now-playing" class="now-playing" aria-label="Reproduciendo ahora" hidden></section>
      <section id="player-bar" class="player-bar" aria-label="Reproductor"></section>
    </div>
    <div id="notifications" class="notifications" aria-label="Avisos"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
